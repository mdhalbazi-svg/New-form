
name: Islamic Daily Diary Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Project Files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f icon-only.png
          test -f icon-foreground.png
          test -f icon-background.png
          echo "Project files verified"

      - name: Install Dependencies
        run: npm install

      - name: Verify Capacitor
        run: npm ls @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Build
        run: test -f www/index.html

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Android App Icons
        run: npx capacitor-assets generate --android --assetPath .

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks
          echo "Keystore verified"

      - name: Configure Release Signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias "myislamicdiary"
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in s:
              s, n = re.subn(
                  r'(\bandroid\s*\{)',
                  lambda m: m.group(1) + "\n" + signing,
                  s, count=1
              )
              if n != 1:
                  raise SystemExit("Android block not found")

          if "signingConfig signingConfigs.release" not in s:
              s, n = re.subn(
                  r'(\bbuildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  s, count=1
              )
              if n != 1:
                  raise SystemExit("Release build type not found")

          p.write_text(s)
          print("Release signing configured")
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Signed Release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK and Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Daily-Diary-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
          
