
name: Islamic Daily Diary Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Project Files
        run: |
          test -f package.json
          test -f capacitor.config.json
          echo "Project files verified"

      - name: Install Dependencies
        run: npm install

      - name: Verify Capacitor Android
        run: npm ls @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Build
        run: |
          test -f www/index.html
          echo "Web application verified"

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Daily-Diary-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
          
