
name: Islamic Daily Diary Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: islamic-daily-diary-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Project Files
        run: |
          set -euo pipefail

          for f in \
            package.json \
            capacitor.config.json \
            index.html \
            app.js \
            prayer.js \
            notify.js \
            ads.js \
            ads-config.json \
            data.js \
            theme.js \
            icons.js \
            style.css \
            build.js \
            native/MainActivity.java \
            native/IddNative.java \
            native/Scheduler.java \
            native/AlarmReceiver.java \
            native/BootReceiver.java \
            tools/apply_native.py \
            tests/logic.test.js \
            icon-only.png \
            icon-foreground.png \
            icon-background.png
          do
            test -f "$f" || {
              echo "ERROR: Missing file: $f"
              exit 1
            }
          done

          node -e "
            const p = require('./package.json');
            const c = require('./capacitor.config.json');

            if (Number(process.versions.node.split('.')[0]) < 22)
              throw new Error('Node 22 required');

            if (!c.appId || !c.appId.includes('.'))
              throw new Error('Invalid package ID');

            if (p.version !== '3.0.0')
              throw new Error('Unexpected application version');

            console.log('App ID:', c.appId);
            console.log('Version:', p.version);
          "

          python3 -m py_compile tools/apply_native.py

      - name: Verify Signing Secrets
        run: |
          set -euo pipefail

          for name in \
            KEYSTORE_BASE64 \
            KEYSTORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: Missing GitHub Secret: $name"
              exit 1
            fi
          done

          echo "All signing secrets are available."

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Dependencies
        run: |
          set -euo pipefail

          npm ls \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/assets \
            @capacitor-community/admob

      - name: JavaScript Syntax Check
        run: npm run check

      - name: Run Logic Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Build
        run: |
          set -euo pipefail

          test -f www/index.html
          test -f www/app.js
          test -f www/prayer.js
          test -f www/notify.js
          test -f www/ads.js

          echo "Web build verified."

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Android Assets
        run: |
          npx capacitor-assets generate \
            --android \
            --assetPath .

      - name: Sync Android Project
        run: npx cap sync android

      - name: Configure Android SDK
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          if not p.exists():
              raise SystemExit("variables.gradle not found")

          s = p.read_text()

          settings = {
              "minSdkVersion": "24",
              "compileSdkVersion": "36",
              "targetSdkVersion": "36"
          }

          for key, value in settings.items():
              pattern = rf'({key}\s*=\s*)\d+'
              s, count = re.subn(pattern, rf'\g<1>{value}', s)

              if count != 1:
                  raise SystemExit(
                      f"Could not safely configure {key}: {count}"
                  )

          p.write_text(s)
          print("Android SDK configuration updated.")
          PY

      - name: Install Native Android Features
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          python3 tools/apply_native.py

          grep -n \
            "AlarmReceiver\|BootReceiver" \
            android/app/src/main/AndroidManifest.xml

          echo "Native Android files installed."

      - name: Verify Application ID
        run: |
          set -euo pipefail

          APP_ID=$(node -p \
            "require('./capacitor.config.json').appId")

          grep -Fq "$APP_ID" android/app/build.gradle

          echo "Application ID: $APP_ID"

      - name: Verify AdMob Integration
        run: |
          set -euo pipefail

          npm ls @capacitor-community/admob

          grep -q \
            "com.google.android.gms.ads.APPLICATION_ID" \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "admob_app_id" \
            android/app/src/main/res/values/strings.xml

          node -e "
            const c = require('./ads-config.json');

            if (!['test', 'production'].includes(c.mode))
              throw new Error('Invalid AdMob mode');

            console.log('AdMob mode:', c.mode);
          "

      - name: Decode Android Keystore
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/diary-signing"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > "$RUNNER_TEMP/diary-signing/release.jks"

          test -s "$RUNNER_TEMP/diary-signing/release.jks"

      - name: Verify Keystore
        run: |
          set -euo pipefail

          keytool -list \
            -keystore "$RUNNER_TEMP/diary-signing/release.jks" \
            -alias "$KEY_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD

          echo "Keystore verified."

      - name: Build Debug APK
        run: |
          set -euo pipefail

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release APK and AAB
        run: |
          set -euo pipefail

          cd android

          ./gradlew assembleRelease bundleRelease --no-daemon

          test -f app/build/outputs/bundle/release/app-release.aab

          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign Release APK and AAB
        run: |
          set -euo pipefail

          KS="$RUNNER_TEMP/diary-signing/release.jks"

          BT=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -1)

          test -n "$BT"

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          test -f "$AAB"
          test -f "$APK"

          jarsigner \
            -keystore "$KS" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -signedjar "$RUNNER_TEMP/app-release-signed.aab" \
            "$AAB" \
            "$KEY_ALIAS"

          jarsigner -verify \
            "$RUNNER_TEMP/app-release-signed.aab"

          cp "$RUNNER_TEMP/app-release-signed.aab" "$AAB"

          "$BT/zipalign" -f -p 4 \
            "$APK" \
            "$RUNNER_TEMP/app-aligned.apk"

          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            "$RUNNER_TEMP/app-aligned.apk"

          "$BT/apksigner" verify \
            --verbose \
            --print-certs \
            android/app/build/outputs/apk/release/app-release-signed.apk

          echo "Release APK and AAB signatures verified."

      - name: Check AdMob Release Mode
        run: |
          node -e "
            const c = require('./ads-config.json');

            if (c.mode !== 'production') {
              console.log('::warning::AdMob is in TEST mode.');
            } else {
              console.log('Production AdMob mode selected.');
            }
          "

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Daily-Diary-Android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-signed.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
          
