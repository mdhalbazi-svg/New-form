
name: Islamic Daily Diary Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Project Files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f icon-only.png
          test -f icon-foreground.png
          test -f icon-background.png
          echo "Project files verified"

      - name: Install Dependencies
        run: npm install

      - name: Verify Capacitor
        run: npm ls @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Build
        run: test -f www/index.html

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Android App Icons
        run: npx capacitor-assets generate --android --assetPath .

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"

          mkdir -p android/app

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > android/app/release-key.jks

          test -s android/app/release-key.jks

          echo "Keystore decoded successfully"

      - name: Configure Release Signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit("build.gradle not found")

          s = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias "myislamicdiary"
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          """

          if not re.search(
              r'signingConfigs\s*\{[\s\S]*?\brelease\s*\{',
              s
          ):
              s, n = re.subn(
                  r'(\bandroid\s*\{)',
                  lambda m: m.group(1) + "\n" + signing,
                  s,
                  count=1
              )

              if n != 1:
                  raise SystemExit("Android block not found")

          if not re.search(
              r'signingConfig\s+signingConfigs\.release',
              s
          ):
              s, n = re.subn(
                  r'(\bbuildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  s,
                  count=1
              )

              if n != 1:
                  raise SystemExit("Release build type not found")

          p.write_text(s)

          print("Release signing configured successfully")
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Signed Release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Verify Build Outputs
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          echo "APK and AAB verified successfully"

      - name: Upload APK and Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Daily-Diary-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
          
