name: Islamic Daily Diary Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: islamic-daily-diary-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Project Files
        run: |
          set -euo pipefail
          for f in package.json capacitor.config.json index.html app.js build.js; do
            test -f "$f" || { echo "ERROR: Missing file: $f"; exit 1; }
          done
          node -e "const p=require('./package.json'); const c=require('./capacitor.config.json'); if(!c.appId || !c.appId.includes('.')) throw new Error('Invalid appId'); console.log('App ID:',c.appId,'Version:',p.version);"
          test -f logic.test.js || { echo 'ERROR: Missing logic.test.js'; exit 1; }
      - name: Verify Signing Secrets
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "ERROR: Missing GitHub Secret: $name"; exit 1; fi
          done
      - name: Install Dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript Syntax Check
        run: npm run check
      - name: Run Logic Tests
        run: npm test
      - name: Build Web Application
        run: npm run build
      - name: Verify Web Build
        run: |
          set -euo pipefail
          test -f www/index.html
          test -f www/app.js
          echo 'Web build verified.'
      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Sync Android Project
        run: npx cap sync android
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          if not p.exists(): raise SystemExit('variables.gradle not found')
          s=p.read_text()
          for key,value in {'minSdkVersion':'24','compileSdkVersion':'36','targetSdkVersion':'36'}.items():
              s,count=re.subn(rf'({key}\s*=\s*)\d+',rf'\g<1>{value}',s)
              if count != 1: raise SystemExit(f'Could not safely configure {key}: {count}')
          p.write_text(s)
          print('Android SDK configuration updated.')
          PY
      - name: Verify Application ID
        run: |
          set -euo pipefail
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          grep -R -Fq "$APP_ID" android/app
          echo "Application ID: $APP_ID"
      - name: Decode Android Keystore
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diary-signing"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/diary-signing/release.jks"
          test -s "$RUNNER_TEMP/diary-signing/release.jks"
      - name: Verify Keystore
        run: |
          keytool -list -keystore "$RUNNER_TEMP/diary-signing/release.jks" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Build Release APK and AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon
          test -f app/build/outputs/bundle/release/app-release.aab
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign Release APK and AAB
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/diary-signing/release.jks"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          APK='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          jarsigner -keystore "$KS" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$RUNNER_TEMP/app-release-signed.aab" "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$RUNNER_TEMP/app-release-signed.aab"
          cp "$RUNNER_TEMP/app-release-signed.aab" "$AAB"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/app-aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out android/app/build/outputs/apk/release/app-release-signed.apk "$RUNNER_TEMP/app-aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release-signed.apk
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Daily-Diary-Android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-signed.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
